name: DouYin Spark Flow Schedule Run

# 瀹氭椂璺戜竴杞换鍔★紝鐜鍦?runner 涓婄幇鎼紙瀵瑰簲 Docker 鐨勫畾鏃?cron 褰㈡€侊級銆?# 閰嶇疆鏉ヨ嚜 Variables / Secrets锛圗nvironment: user-data锛夛紝鐢?export_github_env.py
# 缁?toJson 娉ㄥ叆杩涚▼鐜 鈥斺€?COOKIES_<鎶栭煶鍙? 閿悕璺熺潃璐﹀彿璧帮紝娌℃硶閫愭潯鍐?env 鏄犲皠銆?on:
  workflow_dispatch: # 鍏佽鎵嬪姩瑙﹀彂
  schedule: # 瀹氭椂浠诲姟
    - cron: "0 0 * * *" # 姣忓ぉ 0:00 UTC锛堝搴斿寳浜椂闂?8:00锛?
# 鍚屼竴璐﹀彿骞跺彂鐧诲綍浼氭妸浼氳瘽鎸ゆ帀
concurrency:
  group: douyin-spark-flow
  cancel-in-progress: false

env:
  # 涓?Dockerfile 鐨?CLOAK_CHROMIUM_VERSION / CLOAK_BINARY_SHA256 涓€鑷达紝鏀硅涓€璧锋敼
  CLOAK_CHROMIUM_VERSION: 146.0.7680.177.5
  CLOAK_BINARY_SHA256: 4a12bcde95fa1bb1beef2b41ab5e5c27c36be78e3be3d0dac8c64d705216670e
  CLOAKBROWSER_AUTO_UPDATE: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  run-main:
    timeout-minutes: 40 # 棣栨瑕佷笅瀛椾綋 + Chromium + 渚濊禆
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Test Douyin Accessibility
      run: |
        curl -I https://creator.douyin.com/

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 鍙渚濊禆搴擄紱娴忚鍣ㄦ湰浣撶敤涓嬮潰鐨勯殣韬?Chromium
    - name: 瀹夎 Chromium 绯荤粺渚濊禆
      run: python -m playwright install-deps chromium

    # 缂?Windows 瀛椾綋鏄瓧浣撴寚绾圭殑鐮寸唤锛涘け璐ュ彧鍛婅锛屼笉闃绘柇褰撳ぉ浠诲姟銆?    # 杩欓噷涓嶅姞 actions/cache锛氫笅杞藉け璐ユ椂鐩綍鏄┖鐨勶紝cache 浠嶄細鎶婂畠瀛樻垚姝ｅ紡鏉＄洰锛?    # 涔嬪悗姣忔杩愯閮藉懡涓┖缂撳瓨銆佷笅杞芥楠よ璺宠繃锛屽瓧浣撳氨鍐嶄篃瑁呬笉涓婁簡銆?    - name: 涓嬭浇骞跺畨瑁?Windows 榛樿瀛椾綋
      continue-on-error: true
      run: |
        set -e
        mkdir -p /tmp/wf
        curl -fL --connect-timeout 15 --max-time 600 --retry 2 --retry-delay 3 \
          -o /tmp/wf.tar.gz \
          https://github.com/ErwinLiYH/all_win10_fonts/archive/refs/heads/main.tar.gz
        tar -xzf /tmp/wf.tar.gz -C /tmp/wf

        sudo mkdir -p /usr/share/fonts/truetype/windows
        count=0
        while IFS= read -r -d '' font; do
          sudo cp -n "$font" /usr/share/fonts/truetype/windows/ && count=$((count + 1))
        done < <(find /tmp/wf -type f \( -iname "*.ttf" -o -iname "*.ttc" -o -iname "*.otf" \) -print0)
        sudo fc-cache -f >/dev/null 2>&1 || true

        echo "==> 瀹夎瀛椾綋 $count 涓?
        fc-list | grep -qiE 'segoe ui|microsoft yahei|simsun|calibri' \
          && echo "==> Windows 瀛椾綋灏辩华" \
          || echo "::warning::fc-list 閲屾病鐪嬪埌鍏抽敭 Windows 瀛椾綋"

    # 蹇呴』鐢?CloakHQ 鐨勬瀯寤猴紙cloakbrowser 鍚姩鐨勬槸鑷繁鐨勪簩杩涘埗锛?    - name: 涓嬭浇闅愯韩 Chromium
      run: |
        set -euo pipefail
        tag="chromium-v${CLOAK_CHROMIUM_VERSION}"
        url="https://github.com/CloakHQ/CloakBrowser/releases/download/${tag}/cloakbrowser-linux-x64.tar.gz"
        echo "==> 涓嬭浇 $url"
        curl -fL --connect-timeout 15 --max-time 600 --retry 2 --retry-delay 2 \
          -o /tmp/cb.tar.gz "$url"
        echo "${CLOAK_BINARY_SHA256}  /tmp/cb.tar.gz" | sha256sum -c -

        mkdir -p /tmp/cb_extract "$HOME/cloakbrowser"
        tar -xzf /tmp/cb.tar.gz -C /tmp/cb_extract
        rm -f /tmp/cb.tar.gz

        chrome="$(find /tmp/cb_extract -maxdepth 6 -type f -name chrome -perm -u+x | head -n 1)"
        test -n "${chrome}" || { echo "鍙戝竷鍖呴噷娌℃壘鍒?chrome 浜岃繘鍒? >&2; exit 1; }
        # 蹇呴』鏁寸洰褰曟嫹璐濓細icudtl.dat / *.pak / locales 缂轰竴涓兘鍚姩涓嶄簡
        cp -a "$(dirname "${chrome}")/." "$HOME/cloakbrowser/"
        chmod +x "$HOME/cloakbrowser/chrome"
        test -f "$HOME/cloakbrowser/icudtl.dat" || { echo "缂?icudtl.dat" >&2; exit 1; }

        "$HOME/cloakbrowser/chrome" --version
        echo "CLOAKBROWSER_BINARY_PATH=$HOME/cloakbrowser/chrome" >> "$GITHUB_ENV"

    - name: Export Github Environment Variables and Secrets to JSON
      env:
        VARS_JSON: ${{ toJson(vars) }}
        SECRETS_JSON: ${{ toJson(secrets) }}
      run: python utils/export_github_env.py

    - name: Run DouYin Spark Flow
      run: python main.py task

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: run-logs
        path: logs/

  workflow-keepalive:
    # 浠撳簱 60 澶╂病娲诲姩浼氳 GitHub 鍋滄帀 schedule
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
